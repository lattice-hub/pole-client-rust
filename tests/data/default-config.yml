global:
  #描述: SDK api调用相关配置
  api:
    #描述: api超时时间
    timeout: 1s
    #描述: 客户端给服务端定时上报自身信息的间隔
    reportInterval: 10m
    #描述: api因为网络原因调用失败后的最大重试次数
    maxRetryTimes: 1
    #描述: 2次重试之间的重试间隔
    retryInterval: 500ms
  #描述: 对接北极星服务端的相关配置
  serverConnectors:
    #描述: 服务发现控制面直连地址
    discover:
      addresses:
        - 127.0.0.1:8091
      protocol: grpc
      connectTimeout: 500ms
      messageTimeout: 5s
    #描述: 配置中心控制面直连地址
    config:
      addresses:
        - 127.0.0.1:8093
      protocol: grpc
      connectTimeout: 500ms
      messageTimeout: 5s
    #描述: OTLP Collector 直连地址，SDK 以 OTLP batch push 上报
    observability:
      addresses:
        - 127.0.0.1:4317
      protocol: otlpGrpc
      connectTimeout: 500ms
      messageTimeout: 5s
  location:
    providers:
      - name: local
        options:
          region: ${REGION:}
          zone: ${ZONE:}
          campus: ${CAMPUS:}
  #描述: SDK 客户端身份和标签
  client:
    id: pole-rust-client
    labels: {}
    # 可选：启用 control-plane 托管的服务身份发现。token 只用于 SDK 与 control-plane 认证。
    # serviceIdentityDiscovery:
    #   namespace: production
    #   service: orders
    #   controlPlaneToken: <control-plane-service-token>
#描述: 主调端配置
consumer:
  #描述: 服务路由相关配置
  serviceRouter:
    #描述: 前置路由链
    beforeChain:
      # 隔离路由
      - name: isolatedRouter
    #描述: 服务路由链
    coreChain:
      # 泳道路由
      - name: laneRouter
      # 元数据路由
      - name: metadataRouter
        options:
          #描述: 元数据路由降级策略。none(不降级), all(降级返回所有的节点), others(降级返回其他KEY的节点)
          metadataFailOverType: all
      # 规则路由
      - name: ruleBasedRouter
        options:
          #描述：规则路由降级策略。all（降级返回所有的节点）,none(不降级)
          failoverType: all
      # 就近路由
      - name: nearbyBasedRouter
        options:
          #描述: 就近路由的最小匹配级别。region(大区)、zone(区域)、campus(园区)
          matchLevel: zone
          #描述: 最大匹配级别
          maxMatchLevel: all
          #描述: 强制就近
          strictNearby: false
          #描述: 全部实例不健康时是否降级其他地域
          enableDegradeByUnhealthyPercent: false
          #描述: 达到降级标准的不健康实例百分比
          unhealthyPercentToDegrade: 100
          #描述: 是否通过上报方式获取地域信息
          enableReportLocalAddress: false
    #描述: 后置路由链
    afterChain:
      # 兜底（全死全活）路由
      - name: recoverRouter
        options:
          # 是否剔除被熔断的实例
          excludeCircuitBreakInstances: true
  #描述:负载均衡相关配置
  loadBalancer:
    #描述: 负载均衡类型（已注册的负载均衡插件名）
    defaultPolicy: weightedRandom
    plugins:
      - weightedRandom
  #描述: 本地服务缓存相关配置
  localCache:
    #描述: 缓存插件名
    name: memory
    #描述: 是否启用服务数据缓存
    serviceExpireEnable: true
    #描述: 服务过期淘汰时间
    serviceExpireTime: 24h
    #描述: 服务定期同步刷新周期
    serviceRefreshInterval: 2s
    #描述: 拉取服务元信息列表定期同步刷新周期
    serviceListRefreshInterval: 60s
    #描述: 是否启用服务数据文件缓存
    persistEnable: true
    #描述: 服务缓存持久化目录，SDK在实例数据更新后，按照服务维度将数据持久化到磁盘
    persistDir: ./pole/backup
# 被调方配置
provider:
  # 优雅上下线
  lossless:
    # 优雅上下线功能需要对外提供接口，接口的监听IP
    host: 0.0.0.0
    # 优雅上下线功能需要对外提供接口，接口的监听端口
    port: 28080
    # 优雅上线时，如果没有启动探测，则兜底延迟多久会进行上线
    delayRegisterInterval: 30s
    # 优雅上线的探测周期
    healthCheckInterval: 5s
# 配置中心默认配置
config:
  # 类型转化缓存的key数量
  propertiesValueCacheSize: 100
  # 类型转化缓存的过期时间，默认为1分钟
  propertiesValueExpireTime: 60000
  # 配置过滤器
  configFilter:
    enable: true
    chain:
      # 启用配置解密插件
      - crypto
    plugin:
      crypto:
        # 配置解密插件的算法插件类型
        entries:
          - name: AES
